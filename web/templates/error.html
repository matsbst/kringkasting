{{define "main"}}<section class="pt-20 pb-12">
<p class="text-6xl font-extralight text-ink-3 dark:text-ink-3-dark tabular-nums leading-none">{{if .NotFound}}404{{else}}Oi!{{end}}</p>
<h1 class="mt-6 text-4xl font-bold tracking-tight">{{if .NotFound}}Fant ikke siden{{else}}Noe gikk galt{{end}}</h1>
<p class="mt-4 text-lg text-ink-2 dark:text-ink-2-dark max-w-lg">{{if .NotFound}}Siden du leter etter finnes ikke. Prøv å søke etter podkasten i stedet.{{else}}Prøv igjen om et lite øyeblikk.{{end}}</p>
<form action="/" method="get" class="mt-8 max-w-md">
<label class="sr-only" for="query">Søk etter NRK-podkast</label>
<input type="search" id="query" name="query" placeholder="Søk etter en NRK-podkast" class="w-full h-12 rounded-lg border-2 border-line dark:border-line-dark bg-canvas dark:bg-canvas-dark px-4 text-base placeholder:text-ink-3 dark:placeholder:text-ink-3-dark focus:outline-none focus:border-ink dark:focus:border-ink-dark"/>
</form>
<a href="/" class="mt-6 inline-block text-sm underline underline-offset-2 text-ink-2 dark:text-ink-2-dark hover:text-ink dark:hover:text-ink-dark">Til forsiden</a>
</section>{{end}}
