name: Build

on:
  push:
    branches: [main]
    # a version tag (v2.0.0) re-tags the image main already built
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# jobs that need more ask for it themselves
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # pinned in go.mod (tool directive), so Dependabot keeps it current
      - run: go tool staticcheck ./...
      # the stylesheet is embedded in the binary
      - run: ./tools/build-css.sh
      # offline: NRK is replayed from testdata/; live tests are opt-in (-tags live)
      - run: go test -race ./...
      - run: go build ./cmd/kringkasting

  image:
    # pull requests (Dependabot image bumps too) build the image and start
    # it once before merge; nothing is pushed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: kringkasting:test
          cache-from: type=gha
      - name: Start the container
        run: |
          docker run -d --name kringkasting -p 8000:8000 -v kringkasting-data:/app/data kringkasting:test
          for _ in $(seq 30); do
            curl -fs -o /dev/null http://localhost:8000/ && break
            sleep 1
          done
          docker logs kringkasting
          curl -fsS -o /dev/null http://localhost:8000/
          docker exec kringkasting /app/code/kringkasting healthcheck

  docker:
    # only publish images from main; PRs and manual runs on other
    # branches just run tests, and version tags reuse the image built for
    # their commit (the release job)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # only the runtime stage's `apk add` runs under emulation for arm64
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # the build stage cross-compiles, so arm64 needs no emulation
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    # v2.0.0 → :2.0.0, :2.0 and :2, pointing at the exact image main built
    # and deployed for that commit, so a release is never a fresh build
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version tags look like v2.0.0; got $VERSION" && exit 1
          fi
          minor="${version%.*}"
          major="${minor%.*}"
          # a tag pushed together with its commit arrives before main's
          # build has published the image: wait for it (up to 20 minutes)
          for _ in $(seq 40); do
            docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >/dev/null 2>&1 && break
            echo "Waiting for the image of $GITHUB_SHA"
            sleep 30
          done
          # fails when the commit was never built on main: tag main commits only
          docker buildx imagetools create \
            --tag "$IMAGE:$version" --tag "$IMAGE:$minor" --tag "$IMAGE:$major" \
            "$IMAGE:$GITHUB_SHA"

  deploy:
    # the maintainer's own auto-deploy to kringkast.ing — scoped to this
    # repository so forks get test + build + image publish but never a
    # deploy job wired to someone else's server
    if: github.repository == 'matsbst/kringkasting' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    # one deploy at a time, in push order: a quick second push must not
    # finish first and then be overwritten by the older image
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # `cloudron update` reads CloudronManifest.json from the working directory
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 24
      # the CLI gets the Cloudron token: install exactly the locked
      # versions, without install scripts
      - run: npm ci --ignore-scripts --prefix tools/cloudron
      - name: Deploy to Cloudron
        env:
          CLOUDRON_SERVER: ${{ secrets.CLOUDRON_SERVER }}
          CLOUDRON_TOKEN: ${{ secrets.CLOUDRON_TOKEN }}
        run: |
          if [ -z "$CLOUDRON_SERVER" ] || [ -z "$CLOUDRON_TOKEN" ]; then
            echo "CLOUDRON_SERVER / CLOUDRON_TOKEN secrets not set — skipping deploy."
            exit 0
          fi
          tools/cloudron/node_modules/.bin/cloudron \
            --server "$CLOUDRON_SERVER" \
            --token "$CLOUDRON_TOKEN" \
            update \
            --app kringkast.ing \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }}
