name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - run: deno install --allow-scripts
      - run: deno task check
      - run: deno task test
      - run: deno task build

  docker:
    # only publish images from main; PRs just run tests
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # the maintainer's own auto-deploy to kringkast.ing — scoped to this
    # repository so forks get test + build + image publish but never a
    # deploy job wired to someone else's server. Set CLOUDRON_SERVER /
    # CLOUDRON_TOKEN secrets to point it at your own Cloudron.
    if: github.repository == 'matsbst/kringkasting' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version: 22
      - run: npm install -g cloudron
      - name: Deploy to Cloudron
        env:
          CLOUDRON_SERVER: ${{ secrets.CLOUDRON_SERVER }}
          CLOUDRON_TOKEN: ${{ secrets.CLOUDRON_TOKEN }}
        run: |
          if [ -z "$CLOUDRON_SERVER" ] || [ -z "$CLOUDRON_TOKEN" ]; then
            echo "CLOUDRON_SERVER / CLOUDRON_TOKEN secrets not set — skipping deploy."
            exit 0
          fi
          cloudron \
            --server "$CLOUDRON_SERVER" \
            --token "$CLOUDRON_TOKEN" \
            update \
            --app kringkast.ing \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }}
