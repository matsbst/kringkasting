name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - run: deno install --allow-scripts
      - run: deno task check
      - run: deno task test
      - run: deno task build

  docker:
    # only publish images from main; PRs just run tests
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # the maintainer's own auto-deploy to kringkast.ing — scoped to this
    # repository so forks get test + build + image publish but never a
    # deploy job wired to someone else's server. Set CLOUDRON_SERVER /
    # CLOUDRON_TOKEN secrets to point it at your own Cloudron.
    if: github.repository == 'matsbst/kringkasting' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with:
          node-version: 22
      - run: npm install -g cloudron
      - name: Deploy to Cloudron
        env:
          CLOUDRON_SERVER: ${{ secrets.CLOUDRON_SERVER }}
          CLOUDRON_TOKEN: ${{ secrets.CLOUDRON_TOKEN }}
        run: |
          if [ -z "$CLOUDRON_SERVER" ] || [ -z "$CLOUDRON_TOKEN" ]; then
            echo "CLOUDRON_SERVER / CLOUDRON_TOKEN secrets not set — skipping deploy."
            exit 0
          fi
          cloudron \
            --server "$CLOUDRON_SERVER" \
            --token "$CLOUDRON_TOKEN" \
            update \
            --app kringkast.ing \
            --image ghcr.io/${{ github.repository }}:${{ github.sha }}
