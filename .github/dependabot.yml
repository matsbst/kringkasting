version: 2
updates:
  # Replace this ecosystem with npm when the Node.js migration lands.
  - package-ecosystem: deno
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      deno-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
