version: 2
updates:
  # Go modules, including the staticcheck tool (go.mod `tool` directive).
  # Not covered by Dependabot: the Tailwind CLI version and checksums in
  # tools/build-css.sh; update those by hand.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # the Go builder and Alpine runtime images in the Dockerfile, together
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      docker-images:
        patterns: ["*"]

  # the Cloudron CLI the deploy job runs (tools/cloudron)
  - package-ecosystem: npm
    directory: /tools/cloudron
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      cloudron-cli:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Oslo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
